<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>출시 전 확인표 · 우리앨범</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 -apple-system,"Apple SD Gothic Neo",sans-serif;background:#fbf8f7;color:#2d2d2d;padding:16px;max-width:600px;margin:0 auto;padding-bottom:120px}
h1{font-size:20px;font-weight:700;margin-bottom:4px}
.sub{font-size:13px;color:#7d716f;margin-bottom:16px}
h2{font-size:14px;font-weight:700;color:#7d716f;letter-spacing:.06em;margin:22px 0 8px}
.item{background:#fff;border:1px solid #f0e9e8;border-radius:12px;padding:12px;margin-bottom:8px}
.item.ok{background:#eef6f5;border-color:#1f6b6b}
.item.no{background:#fdf0ef;border-color:#a3231f}
.t{font-size:14.5px;font-weight:700;margin-bottom:2px}
.d{font-size:12.5px;color:#7d716f;line-height:1.5;margin-bottom:8px}
.btns{display:flex;gap:6px}
.btns button{flex:1;min-height:38px;border:1px solid #e0d4d2;border-radius:9px;background:#fff;font-size:13px;font-weight:700;color:#7d716f;cursor:pointer}
.btns button.on-ok{background:#1f6b6b;border-color:#1f6b6b;color:#fff}
.btns button.on-no{background:#a3231f;border-color:#a3231f;color:#fff}
.btns button.on-skip{background:#e6dbd9;color:#5c5250}
.bar{position:fixed;left:0;right:0;bottom:0;background:#2d2d2d;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center}
.bar .n{flex:1;font-size:13px}
.bar button{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:#ff6b6b;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
.bar button.done{background:#1f6b6b}
pre{white-space:pre-wrap;word-break:break-all;font:12px/1.5 ui-monospace,monospace;background:#3a3a3a;color:#fff;border-radius:10px;padding:10px;margin-top:12px;display:none}
</style></head><body>
<h1>출시 전 확인표</h1>
<p class="sub">화면에 열려 있는 메뉴 전부입니다. 폰에서 하나씩 눌러 보시고 결과를 표시해 주세요.<br>안 해본 것은 비워두셔도 됩니다.</p>
<div id="list"></div>
<pre id="sum"></pre>
<div class="bar"><span class="n" id="n">0 / 0</span><button id="c">결과 복사</button></div>
<script>
var ITEMS = [
 ["첫 화면", [
  ["카테고리 고르기", "가족·친구·연인·동료·여행·모임 눌러서 골라진다"],
  ["앨범 만들기 → 사진 고르기", "사진을 고르면 미리보기가 바로 뜬다"],
  ["우리앨범 소개", "푸터에서 눌러 시트가 열린다"],
  ["약관·개인정보·회사정보", "소개 시트 맨 아래에서 열린다"],
 ]],
 ["로그인", [
  ["카카오로 시작하기", "한 번에 로그인된다 (다시 시도가 안 나온다)"],
  ["이메일로 시작하기", "가입 → 인증 메일 → 로그인까지 된다"],
  ["비밀번호 찾기", "메일이 오고 재설정된다"],
  ["로그아웃", "눌러서 나가진다"],
 ]],
 ["앨범 만들기", [
  ["사진 여러 장 고르기", "10장 이상 골라도 멈추지 않는다"],
  ["사진별 코멘트", "사진 아래에 글을 쓸 수 있다"],
  ["앨범 모양 고르기", "만들기 누르면 시트가 뜨고 추천이 골라져 있다"],
  ["앨범 완성", "만드는 중 화면을 지나 앨범이 나온다"],
 ]],
 ["앨범 화면", [
  ["날짜·장소 머리", "월 / 날짜 / 장소 / 사진 수가 제대로 나온다"],
  ["사진이 다 나온다", "올린 사진이 하나도 빠지지 않는다"],
  ["캡션 수정", "연필을 눌러 고치고 저장된다"],
  ["날짜 넣기·고치기", "20260507 을 치면 2026.05.07 로 들어간다"],
  ["장소 넣기·고치기", "연필로 장소를 넣고 저장된다"],
  ["날짜별 이야기 고치기", "그날의 이야기를 고칠 수 있다"],
  ["우리의 이야기 고치기", "마무리 글을 고칠 수 있다"],
 ]],
 ["하단 메뉴", [
  ["사진 추가", "눌러서 사진이 더해지고 화면에 보인다"],
  ["한마디 쓰기", "눌러서 한마디가 남고 화면에 보인다"],
  ["공유하기", "눌러서 링크가 복사되거나 공유창이 뜬다"],
 ]],
 ["더보기 시트", [
  ["표지 사진 바꾸기", "다른 사진으로 표지를 바꾼다"],
  ["앨범 모양 바꾸기", "모양·종이색을 바꾸면 바로 반영된다"],
  ["파일로 저장하기 (PDF)", "PDF 가 실제로 저장된다"],
  ["실물 앨범으로 받아보기", "눌러서 알려드릴게요 로 바뀐다"],
  ["함께 만들자고 보내기", "참여 링크가 만들어진다"],
  ["구경하라고 보내기", "구경용 링크가 만들어진다"],
  ["이 앨범 지우기", "지우기 전 확인 시트가 뜬다 (실제로 지우진 마세요)"],
  ["보관함에 넣기", "보관되고 목록에서 빠진다"],
 ]],
 ["내 앨범", [
  ["목록이 나온다", "내가 만든 앨범 / 함께 만드는 앨범이 보인다"],
  ["보관함", "보관한 앨범이 보이고 다시 꺼낼 수 있다"],
  ["담아둔 앨범", "구경하다 담아둔 앨범이 보인다"],
 ]],
 ["초대받은 사람", [
  ["링크 열기", "로그인 없이 앨범이 열린다"],
  ["한마디 남기기", "이름을 넣고 한마디를 남길 수 있다"],
  ["사진 추가", "참여자가 사진을 더할 수 있다"],
  ["내 앨범으로 저장하기", "가입하면 그 앨범이 내 목록에 들어온다"],
 ]],
 ["계정", [
  ["회원 탈퇴", "탈퇴가 된다 (실제로 하진 마세요)"],
 ]],
];
var state = {};
var list = document.getElementById('list');
ITEMS.forEach(function(sec, si){
  var h = document.createElement('h2'); h.textContent = sec[0]; list.appendChild(h);
  sec[1].forEach(function(it, ii){
    var key = si + '-' + ii;
    var d = document.createElement('div'); d.className = 'item'; d.id = 'i' + key;
    d.innerHTML = '<div class="t">' + it[0] + '</div><div class="d">' + it[1] + '</div>'
      + '<div class="btns"><button data-k="' + key + '" data-v="ok">된다</button>'
      + '<button data-k="' + key + '" data-v="no">안 된다</button>'
      + '<button data-k="' + key + '" data-v="skip">안 해봄</button></div>';
    d.dataset.sec = sec[0]; d.dataset.name = it[0];
    list.appendChild(d);
  });
});
function refresh(){
  var total = 0, done = 0;
  ITEMS.forEach(function(s){ total += s[1].length; });
  for (var k in state) if (state[k]) done++;
  document.getElementById('n').textContent = done + ' / ' + total + ' 확인함';
}
list.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  var k = b.dataset.k, v = b.dataset.v;
  state[k] = (state[k] === v) ? null : v;
  var box = document.getElementById('i' + k);
  box.className = 'item' + (state[k] === 'ok' ? ' ok' : state[k] === 'no' ? ' no' : '');
  [].forEach.call(box.querySelectorAll('button'), function(x){
    x.className = (state[x.dataset.v === state[k] ? 'x' : 'y'] , x.dataset.v === state[k] ? 'on-' + state[k] : '');
  });
  refresh();
});
document.getElementById('c').addEventListener('click', function(e){
  var no = [], skip = [], ok = 0;
  ITEMS.forEach(function(sec, si){
    sec[1].forEach(function(it, ii){
      var v = state[si + '-' + ii];
      if (v === 'no') no.push(sec[0] + ' · ' + it[0]);
      else if (v === 'ok') ok++;
      else skip.push(sec[0] + ' · ' + it[0]);
    });
  });
  var text = '확인 결과\n된다 ' + ok + '건\n\n[안 된다]\n' + (no.length ? no.join('\n') : '없음')
    + '\n\n[안 해봄]\n' + (skip.length ? skip.join('\n') : '없음');
  var pre = document.getElementById('sum'); pre.style.display = 'block'; pre.textContent = text;
  try { navigator.clipboard.writeText(text); } catch(err){
    var r = document.createRange(); r.selectNodeContents(pre);
    var s = getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); }
  e.currentTarget.textContent = '복사했습니다'; e.currentTarget.className = 'done';
  pre.scrollIntoView({behavior:'smooth'});
});
refresh();
</script></body></html>
