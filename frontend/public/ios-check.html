<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이폰 지원 검사</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:16px/1.6 -apple-system,"Apple SD Gothic Neo",sans-serif;background:#fbf8f7;color:#2d2d2d;padding:18px;max-width:560px;margin:0 auto}
h1{font-size:19px;font-weight:700;margin-bottom:14px}
.box{background:#fff;border:1px solid #f0e9e8;border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:5px 0;border-top:1px solid #f5f1f0}
.row:first-child{border-top:0}
.k{color:#7d716f}.v{font-weight:700}
.ok{color:#1f6b6b}.no{color:#a3231f}
pre{white-space:pre-wrap;word-break:break-all;font:12px/1.5 ui-monospace,monospace;background:#3a3a3a;color:#fff;border-radius:10px;padding:10px;margin:10px 0}
button{width:100%;min-height:50px;border:0;border-radius:12px;background:#ff6b6b;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button.done{background:#1f6b6b}
h2{font-size:14px;font-weight:700;margin-bottom:8px;color:#7d716f}
</style></head><body>
<h1>아이폰 지원 검사</h1>
<div id="r"></div>
<div class="box"><h2>이 내용을 복사해서 대화에 붙여넣어 주세요</h2>
<pre id="sum"></pre><button id="c">복사하기</button></div>
<script>
const T = [];
function t(name, fn){ let ok=false, err=''; try{ ok = !!fn(); }catch(e){ err = String(e).slice(0,60); } T.push([name, ok, err]); }

const ua = navigator.userAgent;
const m = ua.match(/OS (\d+)[_.](\d+)/);
const iosVer = m ? (m[1]+'.'+m[2]) : '알수없음';
const isKakao = /KAKAOTALK/i.test(ua);
const isSafari = /Safari/.test(ua) && !/CriOS|FxiOS/.test(ua);

t('정규식 lookbehind', () => { new RegExp("(?<=a)b"); return true; });
t('정규식 named group', () => { new RegExp("(?<x>a)"); return true; });
t('Array.at()', () => [1,2].at(-1) === 2);
t('Object.hasOwn', () => typeof Object.hasOwn === 'function');
t('structuredClone', () => typeof structuredClone === 'function');
t('String.replaceAll', () => 'aa'.replaceAll('a','b') === 'bb');
t('논리 대입 (??=)', () => { const f = new Function('let a=null;a??=1;return a===1'); return f(); });
t('선택적 체이닝', () => { const f = new Function('return ({}).a?.b === undefined'); return f(); });
t('Promise.allSettled', () => typeof Promise.allSettled === 'function');
t('AbortSignal.timeout', () => typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function');
t('crypto.randomUUID', () => typeof crypto !== 'undefined' && typeof crypto.randomUUID === 'function');
t('createImageBitmap', () => typeof createImageBitmap === 'function');
t('canvas webp', () => document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp'));
t('CSS :has()', () => CSS.supports('selector(:has(a))'));
t('CSS 100dvh', () => CSS.supports('height','100dvh'));
t('CSS aspect-ratio', () => CSS.supports('aspect-ratio','1'));
t('a[download] 속성', () => 'download' in document.createElement('a'));
t('navigator.share', () => typeof navigator.share === 'function');
t('showSaveFilePicker', () => typeof window.showSaveFilePicker === 'function');
t('날짜 공백형식', () => !Number.isNaN(Date.parse('2026-08-13 18:37:39+00')));
t('날짜 ISO T형식', () => !Number.isNaN(Date.parse('2026-08-13T18:37:39+00:00')));

const info = [
  ['iOS 버전', iosVer], ['카카오톡 인앱', isKakao ? '예' : '아니오'],
  ['사파리', isSafari ? '예' : '아니오'],
  ['화면', innerWidth + 'x' + innerHeight],
];

let html = '<div class="box">' + info.map(function(p){return '<div class="row"><span class="k">'+p[0]+'</span><span class="v">'+p[1]+'</span></div>';}).join('') + '</div>';
html += '<div class="box">' + T.map(function(x){return '<div class="row"><span class="k">'+x[0]+'</span><span class="v '+(x[1]?'ok':'no')+'">'+(x[1]?'O':'X')+(x[2]?' '+x[2]:'')+'</span></div>';}).join('') + '</div>';
document.getElementById('r').innerHTML = html;

const fails = T.filter(function(x){return !x[1];}).map(function(x){return x[0];});
const text = 'iOS ' + iosVer + ' / 카톡인앱=' + (isKakao?'O':'X') + ' / 사파리=' + (isSafari?'O':'X')
  + ' / 화면 ' + innerWidth + 'x' + innerHeight + '\n'
  + '실패: ' + (fails.length ? fails.join(', ') : '없음') + '\n'
  + T.map(function(x){return x[0]+'='+(x[1]?'O':'X');}).join(' / ');
document.getElementById('sum').textContent = text;
document.getElementById('c').addEventListener('click', function(e){
  const btn = e.currentTarget;
  try { navigator.clipboard.writeText(text); }
  catch(err) { const r=document.createRange(); r.selectNodeContents(document.getElementById('sum'));
    const s=getSelection(); s.removeAllRanges(); s.addRange(r); document.execCommand('copy'); }
  btn.textContent='복사했습니다 - 대화에 붙여넣어 주세요'; btn.classList.add('done');
});
</script></body></html>
