<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>사진 선택창 확인용</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 60px;
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    color: #26201d;
    background: #ffffff;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 0.4rem; }
  .banner {
    margin: 0 0 20px;
    padding: 12px 14px;
    border-left: 3px solid #ff6b6b;
    background: #fff5f5;
    border-radius: 6px;
    font-size: 15px;
  }
  .banner strong { display: block; font-size: 16px; margin-bottom: 4px; }
  .steps { margin: 0 0 20px; padding-left: 1.2rem; font-size: 15px; color: #5b514d; }
  label.pick {
    display: block;
    margin: 0 0 14px;
    padding: 16px;
    border: 2px solid #d8d2ce;
    border-radius: 12px;
    background: #faf7f4;
    cursor: pointer;
  }
  label.pick b { display: block; font-size: 18px; margin-bottom: 4px; }
  label.pick span { display: block; font-size: 15px; color: #5b514d; }
  label.pick input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
  #result {
    margin-top: 24px;
    padding: 16px;
    border: 2px solid #26201d;
    border-radius: 12px;
    font-size: 17px;
    word-break: break-all;
  }
  #result h2 { margin: 0 0 8px; font-size: 20px; }
  #result .big { font-size: 24px; font-weight: 800; margin: 0 0 10px; }
  #result ol { margin: 0; padding-left: 1.3rem; }
  #result li { margin: 4px 0; }
  .empty { color: #7a6f6a; }
</style>
</head>
<body>
<main>
<h1>사진 선택창 확인용</h1>

<p class="banner">
  <strong>이 화면은 확인용입니다.</strong>
  어떤 설정에서 갤러리(사진 앱)가 선택창에 뜨는지 알아보려고 잠시 올려 둔 페이지입니다.
  여기서 고른 사진은 <b>어디에도 올라가지 않습니다.</b> 확인이 끝나면 이 페이지는 삭제됩니다.
</p>

<ol class="steps">
  <li>아래 세 개를 <b>차례로</b> 눌러 주세요.</li>
  <li>누를 때마다 <b>어떤 항목이 뜨는지</b>(카메라 / 파일 / 갤러리 등) 봐 주세요.</li>
  <li>사진을 고르면 아래에 결과가 표시됩니다. 화면을 캡처해 주세요.</li>
</ol>

<label class="pick">
  <b>A. 사진만 · 여러 장 고르기</b>
  <span>지금 앱에 적용된 설정입니다 (비교 기준)</span>
  <input type="file" accept="image/*" multiple data-label="A. 사진만 · 여러 장">
</label>

<label class="pick">
  <b>B. 사진만 · 한 장만 고르기</b>
  <span>여러 장 고르기를 뺐을 때 갤러리가 뜨는지 봅니다</span>
  <input type="file" accept="image/*" data-label="B. 사진만 · 한 장만">
</label>

<label class="pick">
  <b>C. 모든 파일 · 여러 장 고르기</b>
  <span>사진으로 제한하지 않았을 때 갤러리가 뜨는지 봅니다</span>
  <input type="file" multiple data-label="C. 모든 파일 · 여러 장">
</label>

<div id="result"><p class="empty">아직 고른 파일이 없습니다.</p></div>

<script>
  function formatSize(bytes) {
    if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + "MB";
    if (bytes >= 1024) return Math.round(bytes / 1024) + "KB";
    return bytes + "B";
  }

  var result = document.getElementById("result");

  Array.prototype.forEach.call(document.querySelectorAll("input[type=file]"), function (input) {
    input.addEventListener("change", function () {
      var files = Array.prototype.slice.call(input.files || []);
      var total = files.reduce(function (sum, file) { return sum + file.size; }, 0);
      var rows = files.map(function (file) {
        return "<li>" + file.name + " · " + formatSize(file.size) + " · " + (file.type || "형식 없음") + "</li>";
      }).join("");
      result.innerHTML =
        "<h2>" + input.dataset.label + "</h2>" +
        "<p class=\"big\">" + files.length + "장 · " + formatSize(total) + "</p>" +
        (rows ? "<ol>" + rows + "</ol>" : "<p class=\"empty\">고른 파일이 없습니다.</p>");
      input.value = "";
    });
  });
</script>
</main>
</body>
</html>
