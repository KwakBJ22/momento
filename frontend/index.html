<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>우리앨범 — 함께 만드는 사진 앨범</title>
    <meta name="description" content="사진을 모으면 우리의 이야기가 됩니다." />
    <!-- 붙여 넣은 주소의 카드. 문구는 짧게(카톡이 35자쯤에서 자른다), 주소는 절대·www 없음. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="우리앨범" />
    <meta property="og:title" content="우리앨범 — 함께 만드는 사진 앨범" />
    <meta property="og:description" content="사진을 모으면 우리의 이야기가 됩니다." />
    <meta property="og:url" content="https://woorialbum.com/" />
    <meta property="og:image" content="https://woorialbum.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="우리앨범" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 아이콘 파일은 public/ 에 있다. 그림을 바꿔도 같은 이름이면 이 줄들은 그대로다. -->
    <!-- ★ SVG 를 먼저 둔다: 지원하는 브라우저는 이것을 고르고, 어떤 크기에서도 안 깨진다.
         아래 .ico · png 는 SVG 를 모르는 곳(카카오 인앱·구형 사파리)을 위한 대비다.
         지우지 않는다 — 카카오가 아이콘을 캐시로 물고 있어 png 가 여전히 쓰인다. -->
    <link rel="icon" type="image/svg+xml" href="/wooria-symbol.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#ff6b6b" />
    <!-- 홈 화면에 담았을 때 앱처럼 열리게 하는 값 — 아이폰은 매니페스트를 잘 안 봐서
         메타로 따로 말해야 한다. **PWA 로 만드는 것이 아니다**: 서비스 워커도,
         오프라인 캐시도, 푸시도 없다. 우리 주 통로인 카카오톡 인앱 브라우저에서는
         설치 자체가 안 되고, 브라우저로 직접 들어온 사람에게만 해당한다.
         진짜 PWA 는 출시 뒤 재방문 수치를 보고 판단한다. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="우리앨범" />
    <meta name="application-name" content="우리앨범" />
    <!-- Pretendard: 기기 기본 글꼴에 의존하면 안드로이드 카톡 웹뷰에서
         제조사 기본 글꼴이 나온다. dynamic-subset 은 필요한 글자만 받아 가볍다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <!-- Warm the Supabase connection early: album photos (signed URLs) and token
         refresh are served from here, so the TLS/DNS handshake is ready before the
         first image or auth call. crossorigin variant covers CORS fetch (auth). -->
    <link rel="preconnect" href="https://hbywquveagumdxtjdzoh.supabase.co" crossorigin />
    <link rel="preconnect" href="https://hbywquveagumdxtjdzoh.supabase.co" />
    <script
      src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"
      integrity="sha384-DKYJZ8NLiK8MN4/C5P2dtSmLQ4KwPaoqAfyA/DfmEc1VDxu4yyC7wy6K1Hs90nka"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
